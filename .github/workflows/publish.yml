name: Release

on:
  push:
    tags: ["v*.*.*"]        # exact releases only - never the floating vMAJOR tag

permissions:
  contents: read

jobs:
  build:
    name: build + verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel, check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Tag must match pyproject version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match pyproject version '$VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tmda
    permissions:
      id-token: write          # OIDC - PyPI Trusted Publishing, no API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract this version's changelog entry
        run: |
          python - <<'PY' > notes.md
          import os, pathlib, re, sys
          version = os.environ["VERSION"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          hit = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[)",
              text, re.S | re.M,
          )
          if hit:
              sys.stdout.write(hit.group(1).strip() + "\n")
          else:
              sys.stdout.write(
                  f"See the [CHANGELOG](https://github.com/Gakpey/tmda/blob/"
                  f"v{version}/CHANGELOG.md).\n"
              )
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* \
            --verify-tag \
            --title "$VERSION" \
            --notes-file notes.md

  move-major-tag:
    name: move floating vMAJOR tag
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Lets consumers write `uses: Gakpey/tmda@v1` and always get the latest
      # patch. Pushed with GITHUB_TOKEN, so it does not re-trigger workflows.
      - name: Repoint vMAJOR at this release
        run: |
          MAJOR="v$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1)"
          git tag -f "$MAJOR" "$GITHUB_REF_NAME"
          git push -f origin "$MAJOR"
          echo "Moved **$MAJOR** -> $GITHUB_REF_NAME"
