name: Bug report
description: Something in tmda behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Before filing:** run `tmda check --json <path>` on the affected
        files and paste the output below - it contains most of what is needed
        to reproduce the problem.

  - type: input
    id: version
    attributes:
      label: tmda version
      description: Output of `tmda --version`
      placeholder: "tmda 1.1.0 (spec 1)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12.3 on Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran and its full output.
      render: console
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal .tmda that reproduces it
      description: >
        The smallest ledger that shows the bug, plus its front matter.
        Remove real project detail if needed.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This is about the `.tmda` format or the `tmda` CLI, not my own project's content
          required: true
